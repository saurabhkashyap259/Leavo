name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: please report privately (see SECURITY.md), not here."
  - type: input
    id: version
    attributes:
      label: Leavo version
      description: Admin › Instance, or `leavo --version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker Compose, Kubernetes / container platform, From source, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. As an approver…\n2. …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Logs never contain codes or leave reasons, but please remove names and emails.
      render: text
