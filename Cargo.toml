[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/email",
    "crates/storage",
    "crates/worker",
    "crates/importers",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
