[package]
name = "leavo-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Test support: a throwaway PostgreSQL per test binary, one fresh database per test.
testkit = ["dep:testcontainers", "dep:testcontainers-modules", "dep:dtor"]

[dependencies]
testcontainers = { version = "0.27.3", optional = true }
testcontainers-modules = { version = "0.15.0", features = ["postgres"], optional = true }
chrono = "0.4.45"
leavo-core = { version = "0.1.0", path = "../core" }
leavo-importers = { path = "../importers" }
rust_decimal = "1.43.0"
serde_json = "1.0.154"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "ipnetwork", "rust_decimal", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.20.0", features = ["v7"] }
serde = { version = "1.0.229", features = ["derive"] }
async-trait = "0.1.92"
chrono-tz = "0.10.4"
dtor = { version = "1.0.7", optional = true }


[dev-dependencies]
leavo-db = { path = ".", features = ["testkit"] }
rust_decimal_macros = "1.40.0"
