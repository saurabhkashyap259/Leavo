[package]
name = "leavo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
hmac = "0.12.1"
rand = "0.9.5"
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
uuid = { version = "1.20.0", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1.9.0"
rust_decimal_macros = "1.40.0"

