[package]
name = "leavo-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "leavo"

[lib]
name = "leavo_api"
path = "src/lib.rs"

[[bin]]
name = "leavo"
path = "src/main.rs"

[[bin]]
name = "leavo-demo-seed"
path = "src/bin/demo_seed.rs"

[lints]
workspace = true

[dependencies]
leavo-core = { path = "../core" }
leavo-db = { path = "../db" }
leavo-email = { path = "../email" }
leavo-storage = { path = "../storage" }
leavo-worker = { path = "../worker" }
leavo-importers = { path = "../importers" }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1.53.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
clap = { version = "4.5.61", features = ["derive", "env"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "util"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = { version = "5.5.0", features = ["uuid", "chrono", "yaml"] }
utoipa-axum = "0.2.0"
rust-embed = { version = "8.14.0", features = ["mime-guess", "include-exclude", "interpolate-folder-path"] }
tracing = "0.1.44"
uuid = { version = "1.20.0", features = ["v4", "v7"] }
cookie = "0.18.3"
ipnet = "2.12.2"
chrono = "0.4.45"
base64 = "0.23.1"
chrono-tz = "0.10.4"
rust_decimal = "1.43.0"
thiserror = "2.0.21"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
anyhow = "1.0.105"
rand = "0.9"
sha2 = "0.10"
subtle = "2.6"
async-trait = "0.1.92"
reqwest = { version = "0.13.3", features = ["json"] }

[dev-dependencies]
leavo-db = { path = "../db", features = ["testkit"] }
insta = "1.49.0"
reqwest = { version = "0.13.3", features = ["json", "cookies", "multipart"] }
futures = "0.3.31"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
rust_decimal_macros = "1.40.0"
