[package]
name = "leavo-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
leavo-core = { path = "../core" }
leavo-db = { path = "../db" }
leavo-email = { path = "../email" }
rand = "0.9.5"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
uuid = "1.20.0"

[dev-dependencies]
async-trait = "0.1.92"
leavo-db = { path = "../db", features = ["testkit"] }
serde_json = "1.0.154"
