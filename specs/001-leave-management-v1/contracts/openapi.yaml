              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION: malformed body'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/leaves/{id}:
    get:
      tags:
      - leaves
      operationId: get
      parameters:
      - name: id
        in: path
        description: Request id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request detail including the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveDetail'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found, or not visible to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/leaves/{id}/cancel:
    post:
      tags:
      - leaves
      operationId: cancel
      parameters:
      - name: id
        in: path
        description: Request id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInput'
        required: true
      responses:
        '200':
          description: 'Pending: withdrawn and the days released. Approved and not started: cancelled and every day returned. Started: `cancel_requested` until an approver accepts (only days from the request date on are then returned) or declines'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: 'FORBIDDEN: only the requester cancels'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: 'ALREADY_DECIDED: rejected, cancelled or already waiting for an approver; details { status, decided_by, decided_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: reason)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/me:
    get:
      tags:
      - me
      operationId: get_me
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags:
      - me
      operationId: patch_me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMe'
        required: true
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION (details.field); employee codes are unique in the org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/me/balances:
    get:
      tags:
      - me
      operationId: balances
      parameters:
      - name: year
        in: query
        description: Leave year; defaults to the current one
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 'A card per leave type available to the user: active all-employee types, restricted types with an active grant, and comp-off. `pending` counts days of pending requests; `available = balance − pending`; a leave year that has not started shows its projected allotment (FR-055)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/me/export:
    get:
      tags:
      - me
      operationId: my_export
      responses:
        '200':
          description: Your profile, leave and comp-off history and balance entries as a JSON download
          content:
            application/json: {}
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/me/leaves:
    get:
      tags:
      - me
      operationId: leaves
      parameters:
      - name: year
        in: query
        description: 'Leave year: requests with a day in it'
        required: false
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        description: Leave type id
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: pending, approved, rejected, cancelled or cancel_requested
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: '`next_cursor` of the previous page'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 1–100, default 25
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The user's requests, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION: `details.field` names the bad parameter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/me/leaves.csv:
    get:
      tags:
      - me
      operationId: leaves_csv
      parameters:
      - name: year
        in: query
        description: Leave year
        required: false
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        description: Leave type id
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Request status
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Every matching request (contracts/csv-formats.md §7); dates in the org's time zone
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION: `details.field` names the bad parameter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/orgs:
    post:
      tags:
      - setup
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrg'
        required: true
      responses:
        '201':
          description: Organization created with default leave types; the founder is its admin and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredOrg'
        '404':
          description: Single-organization mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: DOMAIN_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION or CODE_INVALID (bad or expired ticket)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/setup/complete:
    post:
      tags:
      - setup
      operationId: complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSetup'
        required: true
      responses:
        '200':
          description: Organization created; the admin is signed in (sets leavo_sid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '403':
          description: SETUP_TOKEN_INVALID (also once setup is complete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION, PUBLIC_DOMAIN, INVALID_DOMAIN or CODE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/setup/status:
    get:
      tags:
      - setup
      operationId: status
      responses:
        '200':
          description: Whether the first-run wizard is needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
  /api/v1/setup/test-email:
    post:
      tags:
      - setup
      operationId: test_email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmailBody'
        required: true
      responses:
        '200':
          description: 'Sent now (not queued); `ok: false` carries the SMTP error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResult'
        '403':
          description: SETUP_TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/setup/verify-token:
    post:
      tags:
      - setup
      operationId: verify_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBody'
        required: true
      responses:
        '204':
          description: Token is valid
        '403':
          description: SETUP_TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: LOCKED after 5 wrong tries (Retry-After header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/team/calendar:
    get:
      tags:
      - me
      operationId: team_calendar
      parameters:
      - name: month
        in: query
        description: '`YYYY-MM`; defaults to the current month in the org''s time zone'
        required: false
        schema:
          type: string
      - name: scope
        in: query
        description: '`org` (default) or `team`, as for `/away`'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Booked days of approved leave in the month, per day, with the same field rule as `/away`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCalendar'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION: `details.field` is `month` or `scope`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/users/search:
    get:
      tags:
      - me
      operationId: search
      parameters:
      - name: q
        in: query
        description: At least 2 characters of a name or email
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Up to 10 active users of the same organization, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserHit'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    AddDomain:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
      additionalProperties: false
    AdjustmentInput:
      type: object
      required:
      - leave_type_id
      - leave_year
      - delta
      properties:
        delta:
          type: number
          format: double
          description: Non-zero, a multiple of 0.5; negative deducts.
        leave_type_id:
          type: string
          format: uuid
        leave_year:
          type: integer
          format: int32
        note:
          type:
          - string
          - 'null'
          description: 'Required: why (FR-041).'
      additionalProperties: false
    AdminDashboard:
      type: object
      required:
      - away_today
      - pending
      - pending_over_48h
      - upcoming_holidays
      - next_year_holidays_missing
      - setup_checklist
      properties:
        away_today:
          type: array
          items:
            $ref: '#/components/schemas/AwayToday'
        next_year_holidays_missing:
          type: boolean
          description: |-
            From two months before the next leave year starts (1 November for a January year), true
            while next year has no holidays (FR-036).
        pending:
          type: integer
          format: int64
          description: Leave, comp-off and cancellation requests waiting for a decision.
        pending_over_48h:
          type: integer
          format: int64
          description: Of those, waiting longer than the reminder threshold (48 h by default).
        setup_checklist:
          $ref: '#/components/schemas/SetupChecklist'
        upcoming_holidays:
          type: array
          items:
            $ref: '#/components/schemas/HolidayItem'
          description: The next 3, from today.
    AdminUser:
      type: object
      description: A person as admins see them.
      required:
      - id
      - email
      - full_name
      - role
      - status
      - anonymised
      properties:
        anonymised:
          type: boolean
        approver_group:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GroupRef'
            description: The group whose approvers decide this person's requests.
        date_of_joining:
          type:
          - string
          - 'null'
          format: date
        department:
          type:
          - string
          - 'null'
        email:
          type: string
        employee_code:
          type:
          - string
          - 'null'
        full_name:
          type: string
        id:
          type: string
          format: uuid
        role:
          type: string
          description: '`employee`, `approver` or `admin`.'
        status:
          type: string
          description: '`invited`, `active` or `deactivated`.'
    ApplyFrom:
      type: string
      enum:
      - now
      - next_year
    ApprovalItem:
      type: object
      required:
      - id
      - kind
      - requester
      - leave_type
      - from
      - to
      - days
      - reason
      - requested_at
      - version
      - balance
      - team_away
      properties:
        attachment:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AttachmentRef'
        balance:
          $ref: '#/components/schemas/AvailableBalance'
        cancel:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CancelInfo'
            description: 'Present on `kind=cancel` items: the employee asks to cancel leave that has started.'
        dates:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WorkedDate'
          description: 'Present on `kind=comp_off` items: the worked dates claimed.'
        days:
          type: number
          format: double
        end_half:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DayHalf'
        from:
          type: string
          format: date
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: '`leave`, `cancel` (a request to cancel started leave) or `comp_off` (credit for worked days).'
        leave_type:
          $ref: '#/components/schemas/TypeRef'
        reason:
          type: string
        requested_at:
          type: string
          format: date-time
        requester:
          $ref: '#/components/schemas/PersonRef'
        start_half:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DayHalf'
        team_away:
          type: array
          items:
            $ref: '#/components/schemas/TeamAwayItem'
        to:
          type: string
          format: date
        version:
          type: integer
          format: int32
          description: Send back with the decision (optimistic locking).
    ApproverGroup:
      type: object
      required:
      - id
      - name
      - members
      - employees
      properties:
        employees:
          type: integer
          format: int64
          description: People assigned to the group.
        id:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
          description: Approvers and admins who decide this group's requests.
        name:
          type: string
    AttachmentRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    AuditItem:
      type: object
      required:
      - id
      - action
      - entity_kind
      - before
      - after
      - created_at
      properties:
        action:
          type: string
          description: Dotted verb, e.g. `leave.approve`, `balance.adjust`, `user.update`.
        actor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PersonRef'
            description: Null for the system (scheduled jobs) and for setup before the admin exists.
        after:
          type: object
        before:
          type: object
        created_at:
          type: string
          format: date-time
        entity_id:
          type:
          - string
          - 'null'
          format: uuid
        entity_kind:
          type: string
        id:
          type: string
          format: uuid
        ip:
          type:
          - string
          - 'null'
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditItem'
        next_cursor:
          type:
          - string
          - 'null'
    AvailableBalance:
      type: object
      required:
      - available
      properties:
        available:
          type: number
          format: double
          description: Available days of the request's type in the leave year it starts in.
    AwayItem:
      type: object
      required:
      - user
      - from
      - to
      - days
      properties:
        days:
          type: number
          format: double
        from:
          type: string
          format: date
        leave_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TypeRef'
            description: Only for the person's eligible approvers and admins (FR-058).
        reason:
          type:
          - string
          - 'null'
          description: Only for the person's eligible approvers and admins (FR-058).
        to:
          type: string
          format: date
        user:
          $ref: '#/components/schemas/PersonRef'
    AwayList:
      type: object
      required:
      - count_today
      - items
      properties:
        count_today:
          type: integer
          format: int64
          description: People away today (full or half day) within the scope.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AwayItem'
          description: Approved leave overlapping the range, sorted by start date.
    AwayToday:
      type: object
      required:
      - user
      - from
      - to
      - days
      - leave_type
      properties:
        days:
          type: number
          format: double
        from:
          type: string
          format: date
        leave_type:
          $ref: '#/components/schemas/TypeRef'
        to:
          type: string
          format: date
        user:
          $ref: '#/components/schemas/PersonRef'
    Balance:
      type: object
      description: One dashboard card (data-model.md §v_ledger_balances). Days are multiples of 0.5.
      required:
      - leave_type
      - leave_year
      - allotted
      - carried
      - taken
      - adjusted
      - pending
      - available
      properties:
        adjusted:
          type: number
          format: double
        allotted:
          type: number
          format: double
        available:
          type: number
          format: double
        carried:
          type: number
          format: double
        leave_type:
          $ref: '#/components/schemas/BalanceType'
        leave_year:
          type: integer
          format: int32
          description: The leave year these figures belong to (comp-off spans years).
        next_expiry:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NextExpiry'
            description: 'Comp-off only: the soonest date spendable days expire (FR-032).'
        pending:
          type: number
          format: double
        taken:
          type: number
          format: double
    BalanceType:
      type: object
      required:
      - id
      - code
      - name
      - color
      - is_comp_off
      properties:
        code:
          type: string
        color:
          type: string
        id:
          type: string
          format: uuid
        is_comp_off:
          type: boolean
        name:
          type: string
    CalendarDay:
      type: object
      required:
      - date
      - people
      properties:
        date:
          type: string
          format: date
        people:
          type: array
          items:
            $ref: '#/components/schemas/CalendarPerson'
    CalendarPerson:
      type: object
      required:
      - user
      properties:
        half:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DayHalf'
            description: '`null` for the full day.'
        leave_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TypeRef'
        reason:
          type:
          - string
          - 'null'
        user:
          $ref: '#/components/schemas/PersonRef'
    CancelInfo:
      type: object
      description: A request to cancel leave that has already started (FR-020).
      required:
      - requested_at
      - days_returned
      properties:
        days_returned:
          type: number
          format: double
          description: 'Days that go back to the balance if accepted: those dated on or after the request date.'
        reason:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
    CancelInput:
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          description: Optional, up to 500 characters; shown to approvers.
      additionalProperties: false
    CancelResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: '`cancelled`, or `cancel_requested` when the leave has started and an approver must accept.'
    CarryForwardRow:
      type: object
      description: One employee's carry forward for a carry-forward leave type (FR-039).
      required:
      - user
      - leave_type
      - unused
      - carry
      - lapse
      properties:
        carry:
          type: number
          format: double
          description: 'Carried into the next year (negative: a deficit carried as a deduction).'
        lapse:
          type: number
          format: double
          description: Positive days lost.
        leave_type:
          $ref: '#/components/schemas/TypeRef'
        unused:
          type: number
          format: double
          description: Balance of the closing leave year before year end (negative for a deficit).
        user:
          $ref: '#/components/schemas/CarryForwardUser'
    CarryForwardUser:
      type: object
      required:
      - id
      - full_name
      - email
      properties:
        email:
          type: string
        full_name:
          type: string
        id:
          type: string
          format: uuid
    CodePurpose:
      type: string
      enum:
      - login
      - signup
      - register_org
      - setup
    CodeRequest:
      type: object
      required:
      - email
      - purpose
      properties:
        date_of_joining:
          type:
          - string
          - 'null'
          format: date
          description: Optional for signup; used to pro-rate quotas (FR-013, FR-064).
        email:
          type: string
        full_name:
          type:
          - string
          - 'null'
          description: Required for signup.
        purpose:
          $ref: '#/components/schemas/CodePurpose'
        setup_token:
          type:
          - string
          - 'null'
          description: Required for purpose `setup`.
    CodeSent:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Always `"sent"` — the response never reveals whether an account exists (FR-003).
    CompOffCancelled:
      type: object
      required:
      - status
