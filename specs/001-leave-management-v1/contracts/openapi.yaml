openapi: 3.1.0
info:
  title: Leavo API
  description: 'Self-hosted leave management. JSON over `/api/v1`, session-cookie auth, `X-Requested-With: leavo` on state-changing requests.'
  version: 0.1.0
paths:
  /api/v1/admin/approver-groups:
    get:
      tags:
      - admin
      operationId: list
      responses:
        '200':
          description: Groups by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApproverGroup'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - admin
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproverGroup'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: name — empty, too long or taken; member_ids — not approvers/admins)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/approver-groups/{id}:
    delete:
      tags:
      - admin
      operationId: remove
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted; its employees have no group (their requests go to every approver)
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags:
      - admin
      operationId: update
      parameters:
      - name: id
        in: path
        description: Group id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproverGroup'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: name, member_ids)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/audit-log:
    get:
      tags:
      - admin
      operationId: list
      parameters:
      - name: actor
        in: query
        description: Who acted
        required: false
        schema:
          type: string
          format: uuid
      - name: entity
        in: query
        description: Entity id, or entity kind (e.g. `leave_request`)
        required: false
        schema:
          type: string
      - name: action
        in: query
        description: e.g. `leave.approve`; a trailing `.` matches a prefix (`leave.`)
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: YYYY-MM-DD, org time zone, inclusive
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: YYYY-MM-DD, org time zone, inclusive
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: From the previous page
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 1–200, default 50
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION (details.field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/carry-forward/preview:
    get:
      tags:
      - admin
      operationId: carry_forward_preview
      parameters:
      - name: year
        in: query
        description: The leave year being closed; defaults to the current one
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 'Per active employee and carry-forward type with a non-zero balance: what year end will write (or wrote, once it has run) — the same numbers either way (FR-039)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarryForwardRow'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: year)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/carry-forward/preview.csv:
    get:
      tags:
      - admin
      operationId: carry_forward_csv
      parameters:
      - name: year
        in: query
        description: The leave year being closed; defaults to the current one
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '`email,full_name,leave_type,unused,carry,lapse` (contracts/csv-formats.md §7)'
          content:
            text/csv: {}
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/comp-off-credits/{id}/revoke:
    post:
      tags:
      - comp-offs
      operationId: revoke
      parameters:
      - name: id
        in: path
        description: Credit id (from `GET /comp-offs?user=`)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeInput'
        required: true
      responses:
        '200':
          description: 'Revoked: `comp_off_revoked` for the days not yet expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditItem'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: 'FORBIDDEN: admins only'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: 'ALREADY_DECIDED: already revoked'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'NOTE_REQUIRED; CREDIT_IN_USE (used or reserved); VALIDATION (details.field: reason)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/dashboard:
    get:
      tags:
      - admin
      operationId: dashboard
      responses:
        '200':
          description: Org dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/holidays:
    post:
      tags:
      - admin
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayInput'
        required: true
      responses:
        '201':
          description: Added. A mandatory holiday frees that day in pending and approved leave (FR-035)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayItem'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: name — empty, too long or the same date and name exists; kind; location)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/holidays/import:
    post:
      tags:
      - admin
      operationId: import
      parameters:
      - name: dry_run
        in: query
        description: 'true: report what would change and write nothing'
        required: false
        schema:
          type: boolean
      requestBody:
        description: JSON `{ pack }` or `{ copy_from_year, to_year }`, or multipart/form-data with a CSV `file` (contracts/csv-formats.md §6)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSource'
        required: true
      responses:
        '200':
          description: What was (or would be) added; rows already in the calendar are skipped. Added mandatory holidays adjust booked leave (FR-035)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'IMPORT_HAS_ERRORS (apply with row errors; nothing written); VALIDATION (details.field: file, pack, copy_from_year, to_year)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/holidays/{id}:
    delete:
      tags:
      - admin
      operationId: remove
      parameters:
      - name: id
        in: path
        description: Holiday id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted. A mandatory holiday inside approved leave is charged again, even below zero, and the employee and admins are emailed (FR-035)
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags:
      - admin
      operationId: update
      parameters:
      - name: id
        in: path
        description: Holiday id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Any of `date`, `name`, `kind`, `location` (null clears it)
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Updated; booked leave on the old and new date is adjusted (FR-035)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayItem'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: date, name, kind, location)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/import/{kind}:
    post:
      tags:
      - admin
      operationId: import
      parameters:
      - name: kind
        in: path
        description: '`csv` (contracts/csv-formats.md §2–3) or `keka` (§4)'
        required: true
        schema:
          type: string
      - name: dry_run
        in: query
        description: 'true: report only, write nothing'
        required: false
        schema:
          type: boolean
      requestBody:
        description: '`balances` file (required), `history` file (optional); Keka: `leave_type_map` (JSON object name → code), `leave_year` (default: current)'
        content:
          multipart/form-data: {}
      responses:
        '200':
          description: The plan (dry run) or what was applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'IMPORT_HAS_ERRORS (apply with any error row; nothing written); VALIDATION (details.field: balances, leave_type_map, leave_year)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/instance:
    get:
      tags:
      - admin
      operationId: status
      responses:
        '200':
          description: Instance health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceStatus'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/instance/test-email:
    post:
      tags:
      - admin
      operationId: test_email
      responses:
        '202':
          description: A test email is queued to the signed-in admin; its delivery shows in the email status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailQueued'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/leave-types:
    get:
      tags:
      - admin
      operationId: list
      responses:
        '200':
          description: Every leave type, including inactive ones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveType'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - admin
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveTypeInput'
        required: true
      responses:
        '201':
          description: Created. `code`, `name`, `color` and `yearly_quota` are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveType'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION (details.field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/leave-types/{id}:
    patch:
      tags:
      - admin
      operationId: patch
      parameters:
      - name: id
        in: path
        description: Leave type id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveTypeInput'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveType'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION or QUOTA_APPLY_FROM_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/leave-types/{id}/grants:
    get:
      tags:
      - admin
      operationId: list_grants
      parameters:
      - name: id
        in: path
        description: Leave type id
        required: true
        schema:
          type: string
          format: uuid
      - name: include_revoked
        in: query
        description: Include revoked grants (history)
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Grants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - admin
      operationId: grant
      parameters:
      - name: id
        in: path
        description: Restricted leave type id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
        required: true
      responses:
        '200':
          description: Already granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '201':
          description: Granted; the full yearly quota is allotted for the current leave year (once per year)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Type or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION (type is not restricted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/leave-types/{id}/grants/{user_id}:
    delete:
      tags:
      - admin
      operationId: revoke
      parameters:
      - name: id
        in: path
        description: Leave type id
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        description: Grantee
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: 'Revoked: remaining available balance lapses; history and pending requests are kept'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No active grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/org:
    get:
      tags:
      - admin
      operationId: get_org
      responses:
        '200':
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags:
      - admin
      operationId: patch_org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchOrg'
        required: true
      responses:
        '200':
          description: Updated. Time zone and weekend changes apply to requests submitted from now on (FR-062)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: LEAVE_YEAR_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/org/domains:
    get:
      tags:
      - admin
      operationId: list_domains
      responses:
        '200':
          description: Whitelisted domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - admin
      operationId: add_domain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomain'
        required: true
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: DOMAIN_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: INVALID_DOMAIN or PUBLIC_DOMAIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/org/domains/{id}:
    delete:
      tags:
      - admin
      operationId: remove_domain
      parameters:
      - name: id
        in: path
        description: Domain id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: 'Removed: no new signups from it; existing users keep access'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/org/sign-out-all:
    post:
      tags:
      - admin
      operationId: sign_out_all
      responses:
        '204':
          description: Every session in the organization ended, including the caller's (FR-063)
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/reports/leaves:
    get:
      tags:
      - admin
      operationId: leaves
      parameters:
      - name: group_by
        in: query
        description: '`type` (default), `user` or `month`'
        required: false
        schema:
          type: string
      - name: year
        in: query
        description: Leave year; defaults to the current one
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Days taken, one row per group and leave type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportRow'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'VALIDATION (details.field: group_by, year)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/reports/leaves.csv:
    get:
      tags:
      - admin
      operationId: leaves_csv
      parameters:
      - name: group_by
        in: query
        description: '`type` (default), `user` or `month`'
        required: false
        schema:
          type: string
      - name: year
        in: query
        description: Leave year; defaults to the current one
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '`group,leave_type,days` (contracts/csv-formats.md §7)'
          content:
            text/csv: {}
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/admin/users:
    get:
      tags:
      - admin
      operationId: list
      parameters:
      - name: q
        in: query
        description: Name, email or employee code contains
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: invited, active or deactivated
        required: false
        schema:
          type: string
      - name: role
        in: query
        description: employee, approver or admin
        required: false
        schema:
          type: string
      - name: group
        in: query
        description: Approver group the person belongs to
        required: false
