            description: 'Required when `yearly_quota` changes: `now` or `next_year` (FR-056).'
        attachment_required_above_days:
          type:
          - number
          - 'null'
          format: double
        availability:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        max_backdate_days:
          type:
          - integer
          - 'null'
          format: int64
        max_days_per_request:
          type:
          - number
          - 'null'
          format: double
        min_notice_days:
          type:
          - integer
          - 'null'
          format: int64
        name:
          type:
          - string
          - 'null'
        negative_limit:
          type:
          - number
          - 'null'
          format: double
        receives_carry_forward:
          type:
          - boolean
          - 'null'
        sort_order:
          type:
          - integer
          - 'null'
          format: int32
        yearly_quota:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    LedgerItem:
      type: object
      description: One balance entry (FR-040).
      required:
      - id
      - leave_type
      - leave_year
      - delta
      - reason
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PersonRef'
        delta:
          type: number
          format: double
        id:
          type: string
          format: uuid
        leave_type:
          $ref: '#/components/schemas/LedgerType'
        leave_year:
          type: integer
          format: int32
        note:
          type:
          - string
          - 'null'
        reason:
          type: string
          description: |-
            `allotment`, `prorate`, `quota_change`, `carry_forward`, `negative_carry`, `lapse`,
            `leave_taken`, `leave_reversed`, `comp_off_credit`, `comp_off_expired`,
            `comp_off_revoked`, `manual_adjustment` or `import`.
        ref_id:
          type:
          - string
          - 'null'
          format: uuid
        ref_kind:
          type:
          - string
          - 'null'
    LedgerType:
      type: object
      required:
      - id
      - code
      - name
      properties:
        code:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
    Me:
      type: object
      required:
      - id
      - email
      - full_name
      - role
      - org
      - last_notify
      properties:
        date_of_joining:
          type:
          - string
          - 'null'
          format: date
        department:
          type:
          - string
          - 'null'
        email:
          type: string
        employee_code:
          type:
          - string
          - 'null'
        full_name:
          type: string
        id:
          type: string
          format: uuid
        last_notify:
          type: array
          items:
            $ref: '#/components/schemas/NotifyMember'
          description: Notified members of the user's last request (suggestions for the next one).
        org:
          $ref: '#/components/schemas/OrgSummary'
        role:
          type: string
    MigrationStatus:
      type: object
      required:
      - applied
      - pending
      properties:
        applied:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
    NextExpiry:
      type: object
      required:
      - date
      - days
      properties:
        date:
          type: string
          format: date
        days:
          type: number
          format: double
          description: Spendable days that expire on that date.
    NotifyInput:
      type: object
      description: 'A notified member: a colleague by `user_id` or anyone by `email` (FR-059).'
      properties:
        email:
          type:
          - string
          - 'null'
        user_id:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    NotifyMember:
      type: object
      description: A member notified on the user's last request, offered again on the next one.
      required:
      - email
      properties:
        email:
          type: string
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    OrgSettings:
      type: object
      required:
      - id
      - name
      - timezone
      - weekend
      - leave_year_start_month
      - carry_forward_cap
      - comp_off_expiry_days
      properties:
        carry_forward_cap:
          type: number
          format: double
          description: Days of casual leave carried into the next leave year at most.
        comp_off_expiry_days:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        leave_year_start_month:
          type: integer
          format: int32
        name:
          type: string
        timezone:
          type: string
        weekend:
          type: array
          items:
            type: string
    OrgSummary:
      type: object
      required:
      - id
      - name
      - timezone
      - weekend
      - leave_year_start_month
      properties:
        id:
          type: string
          format: uuid
        leave_year_start_month:
          type: integer
          format: int32
        name:
          type: string
        timezone:
          type: string
        weekend:
          type: array
          items:
            type: string
    PackInfo:
      type: object
      required:
      - id
      - name
      - count
      properties:
        count:
          type: integer
          minimum: 0
        id:
          type: string
          description: e.g. `IN/2027`
        name:
          type: string
    PatchMe:
      type: object
      description: 'Date of joining is not editable here: it is set at signup and afterwards only by admins (FR-064).'
      properties:
        department:
          type:
          - string
          - 'null'
          description: Empty string clears it.
        employee_code:
          type:
          - string
          - 'null'
          description: Empty string clears it.
        full_name:
          type:
          - string
          - 'null'
      additionalProperties: false
    PatchOrg:
      type: object
      properties:
        carry_forward_cap:
          type:
          - number
          - 'null'
          format: double
        comp_off_expiry_days:
          type:
          - integer
          - 'null'
          format: int64
        leave_year_start_month:
          type:
          - integer
          - 'null'
          format: int64
          description: Locked once leave data exists (`409 LEAVE_YEAR_LOCKED`).
        name:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        weekend:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    PersonRef:
      type: object
      required:
      - id
      - full_name
      properties:
        full_name:
          type: string
        id:
          type: string
          format: uuid
    Preview:
      type: object
      required:
      - days
      - excluded
      - by_leave_year
      - errors
      properties:
        by_leave_year:
          type: array
          items:
            $ref: '#/components/schemas/YearCharge'
        days:
          type: number
          format: double
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PreviewError'
          description: Every rule the request breaks, in catalogue codes; empty when it can be submitted.
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedDate'
    PreviewError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    RegisterOrg:
      type: object
      required:
      - ticket
      - name
      - timezone
      - leave_year_start_month
      - full_name
      properties:
        full_name:
          type: string
        leave_year_start_month:
          type: integer
          format: int64
        name:
          type: string
        ticket:
          type: string
          description: From `POST /auth/verify` with purpose `register_org`.
        timezone:
          type: string
        weekend:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Defaults to `["sat","sun"]`.
      additionalProperties: false
    RegisteredOrg:
      type: object
      required:
      - org
      - user
      properties:
        org:
          $ref: '#/components/schemas/OrgSummary'
        user:
          $ref: '#/components/schemas/SignedInUser'
    ReportRow:
      type: object
      required:
      - group
      - key
      - leave_type
      - days
      properties:
        days:
          type: number
          format: double
        group:
          type: string
          description: The type's name, the employee's name, or `YYYY-MM`.
        key:
          type: string
          description: The type, employee id, or month the row is for.
        leave_type:
          $ref: '#/components/schemas/ReportType'
    ReportType:
      type: object
      required:
      - id
      - code
      - name
      properties:
        code:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
    RevokeInput:
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          description: Required, up to 500 characters; recorded on the ledger entry.
    SetupAdmin:
      type: object
      required:
      - full_name
      - email
      - code
      properties:
        code:
          type: string
          description: The 6-digit code sent by `POST /auth/code` with purpose `setup`.
        email:
          type: string
        full_name:
          type: string
      additionalProperties: false
    SetupChecklist:
      type: object
      description: Facts behind the setup checklist; the page combines them with what the admin has opened.
      required:
      - holidays
      - approvers
      - invite
      properties:
        approvers:
          type: boolean
          description: At least one approver group exists.
        holidays:
          type: boolean
          description: This leave year has holidays.
        invite:
          type: boolean
          description: Someone besides admins has been invited or signed up.
    SetupOrg:
      type: object
      required:
      - name
      - timezone
      - weekend
      - leave_year_start_month
      properties:
        leave_year_start_month:
          type: integer
          format: int64
        name:
          type: string
        timezone:
          type: string
        weekend:
          type: array
          items:
            type: string
          description: e.g. `["sat","sun"]`
      additionalProperties: false
    SetupStatus:
      type: object
      required:
      - setup_required
      - mode
      - holiday_packs
      properties:
        holiday_packs:
          type: array
          items:
            $ref: '#/components/schemas/PackInfo'
        mode:
          type: string
          description: '`single` or `multi`'
        setup_required:
          type: boolean
    SignedIn:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/SignedInUser'
    SignedInUser:
      type: object
      required:
      - id
      - org_id
      - email
      - full_name
      - role
      properties:
        email:
          type: string
        full_name:
          type: string
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        role:
          type: string
    SignedUrl:
      type: object
      required:
      - url
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        url:
          type: string
    SkippedHoliday:
      type: object
      required:
      - date
      - name
      - reason
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        reason:
          type: string
          description: '`exists`: the same date and name is already in the calendar.'
    SkippedInvite:
      type: object
      required:
      - row
      - email
      - reason
      properties:
        email:
          type: string
        reason:
          type: string
          description: '`exists`: already a user of this instance.'
        row:
          type: integer
          minimum: 0
    TeamAwayItem:
      type: object
      description: |-
        A teammate away on the request's dates. `leave_type` and `reason` are present only when the
        viewer is an admin or an eligible approver of that teammate (FR-058).
      required:
      - full_name
      - from
      - to
      properties:
        from:
          type: string
          format: date
        full_name:
          type: string
        leave_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TypeRef'
        reason:
          type:
          - string
          - 'null'
        to:
          type: string
          format: date
    TeamCalendar:
      type: object
      required:
      - month
      - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
          description: Days with someone away, in order; other days are omitted.
        month:
          type: string
          description: '`YYYY-MM`'
    TestEmailBody:
      type: object
      required:
      - setup_token
      - to
      properties:
        setup_token:
          type: string
        to:
          type: string
      additionalProperties: false
    TestEmailQueued:
      type: object
      required:
      - to
      properties:
        to:
          type: string
    TestEmailResult:
      type: object
      required:
      - ok
      properties:
        error:
          type:
          - string
          - 'null'
          description: The SMTP server's error text when sending failed.
        ok:
          type: boolean
    TokenBody:
      type: object
      required:
      - setup_token
      properties:
        setup_token:
          type: string
      additionalProperties: false
    TypeRef:
      type: object
      required:
      - id
      - code
      - name
      - color
      properties:
        code:
          type: string
        color:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
    UpdateCheckStatus:
      type: object
      required:
      - enabled
      - update_available
      properties:
        enabled:
          type: boolean
          description: '`LEAVO_UPDATE_CHECK`.'
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        latest_version:
          type:
          - string
          - 'null'
        update_available:
          type: boolean
          description: A newer release than this one is published.
    UploadForm:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: PDF, PNG, JPEG, WebP or HEIC, up to 5 MB. The type is detected from the content.
    Uploaded:
      type: object
      required:
      - id
      - name
      - content_type
      - size
      properties:
        content_type:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: integer
          minimum: 0
    UsedOn:
      type: object
      required:
      - leave_request_id
      - from
      - to
      - days
      properties:
        days:
          type: number
          format: double
        from:
          type: string
          format: date
        leave_request_id:
          type: string
          format: uuid
        to:
          type: string
          format: date
    UserBalances:
      type: object
      required:
      - balances
      - ledger
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/LedgerItem'
          description: Entries of the leave year (comp-off entries of every year), oldest first.
    UserHit:
      type: object
      required:
      - id
      - full_name
      - email
      properties:
        email:
          type: string
        full_name:
          type: string
        id:
          type: string
          format: uuid
    UserPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass back as `cursor` for the next page; null on the last.
    Verified:
      type: object
      description: Proof of a verified email for `POST /orgs` (purpose `register_org`).
      required:
      - verified
      - ticket
      properties:
        ticket:
          type: string
          description: Valid for 30 minutes.
        verified:
          type: boolean
    VerifyRequest:
      type: object
      required:
      - email
      - code
      - purpose
      properties:
        code:
          type: string
        email:
          type: string
        keep_signed_in:
          type: boolean
          description: 30-day session instead of 7 days (FR-005).
        purpose:
          $ref: '#/components/schemas/CodePurpose'
    VerifyResponse:
      oneOf:
      - $ref: '#/components/schemas/SignedIn'
      - $ref: '#/components/schemas/Verified'
      description: '`login`/`signup`: the signed-in user (and a session cookie); `register_org`: a ticket.'
    WorkedDate:
      type: object
      description: A worked date claimed for comp-off credit (FR-030).
      required:
      - date
      - portion
      properties:
        date:
          type: string
          format: date
        portion:
          type: number
          format: double
          description: 1 or 0.5.
    WorkedDateInput:
      type: object
      required:
      - date
      - portion
      properties:
        date:
          type: string
          format: date
        portion:
          type: number
          format: double
          description: 1 (full day) or 0.5 (half day).
      additionalProperties: false
    YearCharge:
      type: object
      required:
      - leave_year
      - days
      - available_after
      properties:
        available_after:
          type: number
          format: double
        days:
          type: number
          format: double
        leave_year:
          type: integer
          format: int32
tags:
- name: auth
  description: Passwordless sign-in with 6-digit email codes
- name: me
  description: The signed-in user
- name: setup
  description: First-run setup and organization registration
- name: admin
  description: Organization administration (Org Admins only)
- name: leaves
  description: Leave requests and attachments
- name: comp-offs
  description: 'Comp-off credit: requests, credits, revocation'
- name: approvals
  description: Approvals inbox and decisions (approvers and admins)
